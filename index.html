<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Logarithmic Solar System</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f1e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb703'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <div id="scene-root"></div>

      <header id="header">
        <div class="header-text">
          <h1 id="header-title">로그 스케일 태양계</h1>
          <p id="header-subtitle">3D 태양계 데모</p>
        </div>
        <button id="lang-toggle" type="button" aria-label="언어 전환">EN</button>
      </header>

      <div id="hud">
        <section id="control-panel"></section>
        <section id="info-panel" hidden></section>
        <div id="tooltip" hidden></div>
        <section id="disclaimer"></section>
      </div>

      <!-- Always-accessible fixed toggle: lives OUTSIDE #hud so it stays
           clickable even when the whole UI overlay is hidden. -->
      <button id="ui-toggle" type="button" aria-pressed="false">UI 숨김 (H)</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
